<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music</title>

    <!--FontAwesome-->
    <script src="https://kit.fontawesome.com/fc28c3338f.js" crossorigin="anonymous"></script>
    
    <!--Style-->
    <link rel="stylesheet" href="./Style.css">

</head>
<body>
    

    <div class="container">
        <div class="player">
            <div id="playerView" class="player__view">
                <div class="player__controls player__controls--top">
                    <div class="player__btn player__btn--small player__btn--placeholder" id="btnBack" aria-hidden="true">
                        <i class="fas fa-arrow-left"></i>
                    </div>
                    <h5 class="player__title">Playing Now</h5>
                    <div class="player__btn player__btn--small" id="btnPlaylist" role="button" tabindex="0" aria-label="Ver lista de reproducción">
                        <i class="fas fa-bars"></i>
                    </div>
                </div>

                <div class="player__album">
                    <img alt="" class="player__img" id="cover" hidden>
                    <div class="player__cover-placeholder" id="coverPlaceholder" aria-hidden="true">
                        <i class="fas fa-music"></i>
                    </div>
                </div>

                <h2 class="player__artist" id="artist">Disclousure</h2>
                <h3 class="player__song" id="song">Latch</h3>

                <div class="player__progress">
                    <input type="range" value="0" min="0" max="100" class="player__level" id="progress">
                    <div class="audio__duration">
                        <div class="start" id="timeStart">00:00</div>
                        <div class="end" id="timeEnd">00:00</div>
                    </div>
                </div>

                <audio class="player__audio" id="audio" preload="metadata"></audio>

                <div class="player__modes">
                    <button type="button" class="player__btn player__btn--tiny" id="btnShuffle" aria-label="Reproducción aleatoria" aria-pressed="false">
                        <i class="fas fa-random"></i>
                    </button>
                    <button type="button" class="player__btn player__btn--tiny" id="btnRepeatOne" aria-label="Repetir canción" aria-pressed="false">
                        <i class="fas fa-redo"></i>
                    </button>
                    <button type="button" class="player__btn player__btn--tiny" id="btnRepeatAll" aria-label="Repetir playlist" aria-pressed="false">
                        <i class="fas fa-repeat"></i>
                    </button>
                </div>

                <div class="player__controls player__controls--bottom">
                    <div class="player__btn player__btn--medium" id="btnPrev" role="button" tabindex="0" aria-label="Canción anterior">
                        <i class="fas fa-backward"></i>
                    </div>
                    <div class="player__btn player__btn--medium blue" id="play" role="button" tabindex="0" aria-label="Reproducir o pausar">
                        <i class="fas fa-play play-btn"></i>
                        <i class="fas fa-pause pause-btn hide"></i>
                    </div>

                    <div class="player__btn player__btn--medium" id="btnNext" role="button" tabindex="0" aria-label="Siguiente canción">
                        <i class="fas fa-forward"></i>
                    </div>
                </div>
            </div>

            <div id="playlistView" class="player__view hide">
                <div class="player__controls player__controls--top">
                    <div class="player__btn player__btn--small" id="btnBackFromPlaylist" role="button" tabindex="0" aria-label="Volver al reproductor">
                        <i class="fas fa-arrow-left"></i>
                    </div>
                    <h5 class="player__title">Playlist</h5>
                    <div class="player__btn player__btn--small" id="btnClosePlaylist" role="button" tabindex="0" aria-label="Cerrar lista">
                        <i class="fas fa-bars"></i>
                    </div>
                </div>
                <button type="button" class="player__add" id="btnAddSong">
                    <i class="fas fa-plus"></i> Agregar canción
                </button>
                <input type="file" id="songInput" accept=".mp3,audio/mpeg" hidden>
                <p id="uploadStatus" class="player__status" hidden></p>
                <ul id="playlistList" class="player__playlist"></ul>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/jsmediatags@3.9.5/dist/jsmediatags.min.js"></script>
    <script src="./main.js"></script>
</body>
</html>
